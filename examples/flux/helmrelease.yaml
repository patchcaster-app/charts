# PatchCaster from the verified chart source. The credentials come from the
# existing Secret "patchcaster" (see ../README.md); every other key is
# documented in the chart's values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: patchcaster
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: patchcaster
  values:
    mattermostUrl: https://mattermost.example.com
    existingSecret: patchcaster
    routing:
      file: |
        routes:
          - project: group/application
            channel: "channel-id-here"
    httpRoute:
      enabled: true
      parentRefs:
        - name: public
          namespace: gateway-system
          sectionName: https
      hostnames:
        - patchcaster.example.com
