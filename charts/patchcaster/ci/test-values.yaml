# Rendered by `just chart-check` on every change: exercises the wide values
# path (SA, pull secrets, extraEnv shapes, non-trivial durations, HTTPRoute).
replicaCount: 1
image:
  repository: ghcr.io/patchcaster-app/patchcaster
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
drainTimeout: 45s
pollInterval: 1m30s
claimLease: 2m
eventMaxAge: 6h
seenRetention: 48h
logLevel: debug
service:
  type: ClusterIP
  port: 8080
  internalPort: 9090
httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - patchcaster.example.com
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/patchcaster-demo
routing:
  file: |
    routes:
      - project: group/application
        channel: "channel-id-here"
      - project: group/other
        channel: "channel-id-there"
secrets:
  databaseUrl: postgres://patchcaster:dev@postgres.database.svc:5432/patchcaster?sslmode=require
  mattermostToken: dummy-bot-token
  signingSecrets:
    - rotating-old-secret
    - current-secret
mattermostUrl: https://mm.example.com
extraEnv:
  - name: GOMEMLIMIT
    value: 100MiB
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
podLabels:
  team: platform
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - key: team
    operator: Equal
    value: platform
    effect: NoSchedule
