{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patchcaster.secretName" . }}
  labels:
    {{- include "patchcaster.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required unless existingSecret names a Secret with the same keys" .Values.secrets.databaseUrl | quote }}
  mattermost-token: {{ required "secrets.mattermostToken (bot account token) is required unless existingSecret is set" .Values.secrets.mattermostToken | quote }}
  signing-secrets: {{ required "secrets.signingSecrets needs at least one entry unless existingSecret is set" (join "," .Values.secrets.signingSecrets) | quote }}
{{- end }}
