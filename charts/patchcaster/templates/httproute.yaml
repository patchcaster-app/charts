{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "patchcaster.fullname" . }}
  labels:
    {{- include "patchcaster.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The webhook path only: the internal listener (probes, metrics) stays
    # in-cluster (SYSARCH-004 in the application repository).
    - matches:
        - path:
            type: Exact
            value: /webhook
      backendRefs:
        - name: {{ include "patchcaster.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
