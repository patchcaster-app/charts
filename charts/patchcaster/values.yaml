# Default values for the PatchCaster chart.
# The values surface is validated by values.schema.json: an unknown or
# misspelled key fails the install immediately.

# Single replica is the supported posture: outbox claims are lease-protected
# (FOR UPDATE SKIP LOCKED), so a rollout's brief overlap of two pods is safe,
# but scale-out beyond that is groundwork, not certified operation.
replicaCount: 1

image:
  repository: ghcr.io/patchcaster-app/patchcaster
  # Defaults to the application release the chart was published with,
  # v<appVersion> (for example v0.1.0). Only override to pin something else
  # explicitly.
  tag: ""
  # When set, wins over tag: ghcr.io/patchcaster-app/patchcaster@sha256:...
  digest: ""
  pullPolicy: IfNotPresent

# Registry pull secrets, e.g. [{name: registry-pull}] when the image comes
# from a private mirror. The published image needs none.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# PATCHCASTER_DRAIN_TIMEOUT. The pod's terminationGracePeriodSeconds is always
# derived strictly larger (drain + 3 s), so the drain finishes before the pod
# is killed and the two cannot be misconfigured by hand. Accepts Go durations
# ending in s, m or h.
drainTimeout: 30s

# Delivery and retention tuning. Each value sets the application setting
# named next to it. Empty keeps the application's own default, which its
# configuration reference lists. Durations use Go syntax such as 90s, 15m or
# 4h and must be positive.

# PATCHCASTER_POLL_INTERVAL. New messages wake the worker at once through
# PostgreSQL notifications. This bounds how late it picks up retries that
# come due, messages whose worker died and missed wake-ups. Behind a
# transaction-mode pooler such as PgBouncer there are no wake-ups, so this
# is also how quickly every message goes out.
pollInterval: ""
# PATCHCASTER_CLAIM_LEASE. How long a claimed message stays with its worker
# before another worker may take it over.
claimLease: ""
# PATCHCASTER_EVENT_MAX_AGE. Verified deliveries older than this are
# discarded as stale.
eventMaxAge: ""
# PATCHCASTER_SEEN_RETENTION. How long delivery ids are remembered to drop
# duplicates. It must exceed the event max age, or a replay could pass as
# new. The application refuses to start otherwise.
seenRetention: ""
# PATCHCASTER_LOG_LEVEL: debug, info, warn or error.
logLevel: ""

service:
  type: ClusterIP
  # Webhook listener (GitLab posts here).
  port: 8080
  # Internal listener (probes + metrics); published so in-cluster
  # Prometheus can scrape it without extra plumbing.
  internalPort: 9090

# Gateway API HTTPRoute for the webhook endpoint. The platform owns the
# Gateway with its listeners, hostnames and TLS; the chart only attaches a
# route to it. That needs the Gateway API CRDs and a Gateway whose
# allowedRoutes admit this release's namespace. Only the /webhook path is
# routed, so the internal listener never leaves the cluster. Ingress stays
# deliberately unrendered: it would mix hostname and TLS ownership into the
# chart.
httpRoute:
  enabled: false
  # The Gateway to attach to, e.g. [{name: public, namespace: gateway-system,
  # sectionName: https}]. Required when enabled.
  parentRefs: []
  # Hostnames the route answers for, e.g. [patchcaster.example.com]. Empty
  # means every hostname the Gateway listener accepts.
  hostnames: []

serviceAccount:
  create: false
  name: ""
  annotations: {}

# The routing table is passed through verbatim into a ConfigMap and mounted
# read-only; a change triggers a pod rollout via a template checksum
# annotation. Shape (verified against the app): one `channel` id per `project`
# path; the app refuses to boot on a malformed table.
routing:
  file: |
    routes:
      - project: group/application
        channel: "channel-id-here"

# Secret material. Either let the chart build the Secret (leave existingSecret
# empty and fill secrets.*), or point existingSecret at a Secret you manage —
# then it must carry the keys database-url, mattermost-token, signing-secrets.
existingSecret: ""
secrets:
  databaseUrl: ""
  mattermostToken: ""
  # List; give two entries during secret rotation.
  signingSecrets: []

# Not a secret: the Mattermost site URL.
mattermostUrl: ""

# Appended verbatim to the container environment (name/value or valueFrom).
extraEnv: []

podAnnotations: {}
podLabels: {}
commonLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
