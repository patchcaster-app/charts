# Default values for the PatchCaster chart (ADR-017).
# The values surface is validated by values.schema.json: an unknown or
# misspelled key fails the install immediately.

# Single replica is the supported posture: outbox claims are lease-protected
# (FOR UPDATE SKIP LOCKED), so a rollout's brief overlap of two pods is safe,
# but scale-out beyond that is groundwork, not certified operation.
replicaCount: 1

image:
  repository: ghcr.io/patchcaster-app/patchcaster
  # Defaults to the chart's appVersion, which releases set equal to the
  # application tag. Only override to pin something else explicitly.
  tag: ""
  # When set, wins over tag: ghcr.io/patchcaster-app/patchcaster@sha256:...
  digest: ""
  pullPolicy: IfNotPresent

# Registry pull secrets, e.g. [{name: ghcr-pull}] while the package is private.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# PATCHCASTER_DRAIN_TIMEOUT. The pod's terminationGracePeriodSeconds is always
# derived strictly larger (drain + 3 s), the SYSREQ-023 owner condition, so it
# cannot be misconfigured by hand. Accepts Go durations ending in s, m or h.
drainTimeout: 30s

service:
  type: ClusterIP
  # Webhook listener (GitLab posts here).
  port: 8080
  # Internal listener (probes + metrics); published so in-cluster
  # Prometheus can scrape it without extra plumbing.
  internalPort: 9090

# Gateway API HTTPRoute for the webhook endpoint (ADR-017). The platform owns
# the Gateway with its listeners, hostnames and TLS; the chart only attaches a
# route to it. That needs the Gateway API CRDs and a Gateway whose
# allowedRoutes admit this release's namespace. Only the /webhook path is
# routed, so the internal listener never leaves the cluster. Ingress stays
# deliberately unrendered: it would mix hostname and TLS ownership into the
# chart.
httpRoute:
  enabled: false
  # The Gateway to attach to, e.g. [{name: public, namespace: gateway-system,
  # sectionName: https}]. Required when enabled.
  parentRefs: []
  # Hostnames the route answers for, e.g. [patchcaster.example.com]. Empty
  # means every hostname the Gateway listener accepts.
  hostnames: []

serviceAccount:
  create: false
  name: ""
  annotations: {}

# The routing table (SYSREQ-022) is passed through verbatim into a ConfigMap
# and mounted read-only; a change triggers a pod rollout via a template
# checksum annotation. Shape (verified against the app): one `channel` id per
# `project` path; the app refuses to boot on a malformed table.
routing:
  file: |
    routes:
      - project: group/application
        channel: "channel-id-here"

# Secret material. Either let the chart build the Secret (leave existingSecret
# empty and fill secrets.*), or point existingSecret at a Secret you manage —
# then it must carry the keys database-url, mattermost-token, signing-secrets.
existingSecret: ""
secrets:
  databaseUrl: ""
  mattermostToken: ""
  # List; give two entries during secret rotation (SYSREQ-015).
  signingSecrets: []

# Not a secret: the Mattermost site URL.
mattermostUrl: ""

# Appended verbatim to the container environment (name/value or valueFrom).
extraEnv: []

podAnnotations: {}
podLabels: {}
commonLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
