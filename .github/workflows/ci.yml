# $schema: https://json.schemastore.org/github-workflow.json
---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Lint and render
        run: just chart-check

      # Server-side validation against a real API server (kind is bundled on
      # the runner). --dry-run=server validates every manifest of the wide
      # test values against the cluster's OpenAPI schema without scheduling
      # pods. The smoke job below installs for real. The test values enable
      # the HTTPRoute, so the pinned Gateway API CRDs go in first.
      - name: Validate against a live API server
        env:
          GATEWAY_API_VERSION: v1.6.2
        run: |
          kind create cluster --wait 60s
          kubectl apply --server-side -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          helm install patchcaster charts/patchcaster \
            --values charts/patchcaster/ci/test-values.yaml \
            --namespace patchcaster --create-namespace --dry-run=server
          kind delete cluster

  # A real install of the chart as a released application version, next to
  # a disposable PostgreSQL: the pod has to pull its image and turn ready.
  # Move the pin to each new application release.
  smoke:
    runs-on: ubuntu-latest
    env:
      PATCHCASTER_APP_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install the chart and wait until it is ready
        run: just chart-smoke "${PATCHCASTER_APP_VERSION}"
